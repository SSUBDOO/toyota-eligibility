<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Toyota Eligibility Live Compact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#111}
.hero{background:#d71920;color:white;text-align:center;padding:18px 14px 48px}
.hero h1{margin:0;font-size:21px;line-height:1.2}
.hero p{margin:6px 0 0;font-size:12px;opacity:.9}
.app{max-width:760px;margin:-34px auto 0;padding:0 10px 68px}
.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
label{display:block;margin-top:10px;font-size:10px;font-weight:900;color:#666;letter-spacing:1.2px;text-transform:uppercase}
input{width:100%;margin-top:5px;padding:11px 12px;font-size:18px;font-weight:900;border:1px solid #ddd;border-radius:12px;background:white;color:#111}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tenureBtn{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 6px;text-align:center;font-weight:900;color:#555;cursor:pointer;font-size:14px}
.tenureBtn.active{border:2px solid #d71920;color:#d71920;background:#fff7f7}
.methodBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.methodBox input{display:none}
.methodBox label{margin:0;padding:10px 8px;border-radius:12px;border:1px solid #ddd;background:#fff;text-align:center;font-size:13px;color:#555;letter-spacing:0;text-transform:none;cursor:pointer}
.methodBox input:checked+label{background:#d71920;color:white;border-color:#d71920}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.grid2 input{font-size:15px;font-weight:800;padding:10px}
.hint{margin-top:9px;text-align:center;color:#777;font-size:11px;line-height:1.35}
.summary{max-width:760px;margin:12px auto 8px;padding:0 10px;color:#555;font-size:13px;font-weight:800}
.cards{max-width:760px;margin:0 auto;padding:0 10px 74px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{background:#fff;border-radius:15px;border:2px solid transparent;box-shadow:0 6px 18px rgba(0,0,0,.05);padding:12px;cursor:pointer;min-height:122px}
.card.pass{border-color:#20a44b}
.card.try{border-color:#f59e0b}
.card.fail{opacity:.58;filter:grayscale(.2)}
.modelName{font-size:16px;font-weight:900;margin-bottom:4px}
.priceRange{color:#666;font-size:11px;margin-bottom:8px}
.bestMonthly{font-size:20px;font-weight:900;color:#d71920;line-height:1.1}
.bestSpec{font-size:11px;color:#555;margin-top:3px;font-weight:800}
.badge{display:inline-block;margin-top:8px;padding:6px 8px;border-radius:999px;font-size:10px;font-weight:900}
.badge.pass{background:#e8f7ed;color:#15803d}
.badge.try{background:#fff7e6;color:#9a5b00}
.badge.fail{background:#fdeaea;color:#b42318}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;z-index:99}
.modal.show{display:flex}
.sheet{width:100%;max-width:760px;margin:0 auto;max-height:86vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:12px 14px 22px}
.close{float:right;width:38px;height:38px;border-radius:999px;border:0;background:#eee;font-size:22px}
.modalTitle{font-size:24px;font-weight:900;margin:38px 0 3px}
.modalSub{color:#666;margin-bottom:12px;font-size:12px}
.quickStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.stat{background:#fafafa;border-radius:13px;padding:10px 6px;text-align:center}
.stat strong{display:block;color:#d71920;font-size:16px;margin-bottom:3px}
.stat span{color:#666;font-size:10px;line-height:1.2}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#666;font-size:10px;letter-spacing:.8px;padding:8px 3px;border-bottom:2px solid #eee}
td{padding:10px 3px;border-bottom:1px solid #eee;vertical-align:top;font-weight:800}
td.monthly{color:#d71920;font-weight:900;white-space:nowrap}
.resultText.pass{color:#15803d}
.resultText.try{color:#9a5b00}
.resultText.fail{color:#b42318}
.wa{position:fixed;left:10px;right:10px;bottom:10px;max-width:740px;margin:auto;display:block;background:#20c45a;color:white;padding:13px;text-align:center;border-radius:14px;font-weight:900;text-decoration:none;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.tiny{font-size:10px;color:#777;line-height:1.35;margin-top:10px;text-align:center}
@media(max-width:430px){
  .hero{padding-top:16px}
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:10px;min-height:116px}
  .modelName{font-size:15px}
  .bestMonthly{font-size:18px}
  .badge{font-size:9px}
}
</style>
</head>
<body>
<div class="hero">
  <h1>🚗 Toyota Eligibility</h1>
  <p>Live quick check: gaji, deposit, rate & monthly</p>
</div>

<div class="app">
  <div class="panel">
    <label>Gaji Bersih</label>
    <input id="salary" type="number" value="3000" inputmode="decimal">

    <div class="grid3">
      <div class="tenureBtn" data-tenure="5">5 Tahun</div>
      <div class="tenureBtn" data-tenure="7">7 Tahun</div>
      <div class="tenureBtn active" data-tenure="9">9 Tahun</div>
    </div>

    <div class="methodBox">
      <input type="radio" id="methodFlat" name="method" value="flat" checked>
      <label for="methodFlat">Flat Rate</label>
      <input type="radio" id="methodEir" name="method" value="eir">
      <label for="methodEir">EIR</label>
    </div>

    <div class="grid2">
      <div>
        <label>Deposit RM</label>
        <input id="depositAmount" type="number" value="9000" inputmode="decimal">
      </div>
      <div>
        <label id="rateLabel">Flat Rate %</label>
        <input id="rate" type="number" value="2.30" step="0.01" inputmode="decimal">
      </div>
    </div>

    <div class="hint" id="hint">LULUS ≤30% gaji · TRY 30%-50% · GAGAL >50%</div>
  </div>
</div>

<div class="summary" id="summary"></div>
<div class="cards" id="cards"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" id="closeBtn">×</button>
    <div class="modalTitle" id="modalTitle"></div>
    <div class="modalSub" id="modalSub"></div>

    <div class="quickStats">
      <div class="stat"><strong id="startDeposit">RM0</strong><span>Deposit</span></div>
      <div class="stat"><strong id="startMonthly">RM0</strong><span>Monthly</span></div>
      <div class="stat"><strong id="modalStatus">-</strong><span>Result</span></div>
    </div>

    <table>
      <thead><tr><th>SPEC</th><th>DEPOSIT</th><th>MONTHLY</th><th>RESULT</th></tr></thead>
      <tbody id="variantRows"></tbody>
    </table>

    <div class="tiny" id="modalTiny"></div>
  </div>
</div>

<a class="wa" id="waBtn" href="#" target="_blank">💬 Tanya Sales Advisor</a>

<script>
const salesPhone = "60173939788";
const LULUS_LIMIT = 30;
const TRY_LIMIT = 50;

const models = [
  { model:"Yaris", tag:"Hatchback", variants:[["1.5E",88000],["1.5G",91600]] },
  { model:"Yaris Cross", tag:"Compact SUV", variants:[["1.5S",99900],["1.5 HEV",109900]] },
  { model:"Vios", tag:"Sedan", variants:[["1.5E",90600],["1.5G",96600],["1.5 HEV",103900],["1.5 GRS HEV",109900]] },
  { model:"Veloz", tag:"7-Seater", variants:[["1.5",95000]] },
  { model:"Corolla Cross", tag:"SUV", variants:[["1.8V",133800],["1.8 HEV",140800],["1.8 GRS HEV",148800]] },
  { model:"Corolla", tag:"Sedan", variants:[["1.8G",144800],["1.8GRS",149800]] },
  { model:"Hilux", tag:"Pickup", variants:[["2.4 S/C MT",104880],["2.4E MT",117880],["2.4E AT",119880],["2.4V AT",149580],["2.8 Rogue",163000],["2.8 GRS",173280],["BEV 144kW",226300]] },
  { model:"Innova Zenix", tag:"MPV", variants:[["2.0V",165000],["2.0 HEV",202000]] },
  { model:"Fortuner", tag:"SUV", variants:[["2.4D AT",195800],["2.8D VRZ",241800],["2.7P SRZ",202880]] },
  { model:"Camry", tag:"Premium Sedan", variants:[["2.5V",221800],["2.5 HEV",248800]] },
  { model:"Harrier", tag:"Premium SUV", variants:[["2.5 HEV",289000]] },
  { model:"Hiace", tag:"Commercial Van", variants:[["Window 2.8 AT",172000],["Panel 3.0 MT",127800]] },
  { model:"Vellfire", tag:"Luxury MPV", variants:[["2.5",448000],["2.5 HEV",549900]] },
  { model:"Alphard", tag:"Luxury MPV", variants:[["2.4 Turbo EL",548000]] },
  { model:"EV", tag:"Electric", variants:[["Urban Cruiser BEV",198000],["bZ4X BEV",220000]] }
].map(m => ({ ...m, variants: m.variants.map(v => ({ spec:v[0], price:v[1] })) }));

const els = {
  salary: document.getElementById("salary"),
  depositAmount: document.getElementById("depositAmount"),
  rate: document.getElementById("rate"),
  rateLabel: document.getElementById("rateLabel"),
  methodFlat: document.getElementById("methodFlat"),
  methodEir: document.getElementById("methodEir"),
  cards: document.getElementById("cards"),
  summary: document.getElementById("summary"),
  modal: document.getElementById("modal"),
  closeBtn: document.getElementById("closeBtn"),
  modalTitle: document.getElementById("modalTitle"),
  modalSub: document.getElementById("modalSub"),
  startDeposit: document.getElementById("startDeposit"),
  startMonthly: document.getElementById("startMonthly"),
  modalStatus: document.getElementById("modalStatus"),
  variantRows: document.getElementById("variantRows"),
  modalTiny: document.getElementById("modalTiny"),
  waBtn: document.getElementById("waBtn"),
  hint: document.getElementById("hint")
};

let selectedTenure = 9;
let lastResults = [];

function rm(value, cents=false) {
  return "RM" + Number(value).toLocaleString("en-MY", {
    minimumFractionDigits: cents ? 2 : 0,
    maximumFractionDigits: cents ? 2 : 0
  });
}

function num(el) {
  const value = Number(el.value);
  return Number.isFinite(value) ? value : 0;
}

function getMethod() {
  return document.querySelector('input[name="method"]:checked').value;
}

function methodName() {
  return getMethod() === "eir" ? "EIR" : "Flat Rate";
}

function monthlyFlat(loan, rate, years) {
  const months = years * 12;
  if (loan <= 0 || months <= 0) return 0;
  const interest = loan * (rate / 100) * years;
  return (loan + interest) / months;
}

function monthlyEir(loan, rate, years) {
  const months = years * 12;
  const r = (rate / 100) / 12;
  if (loan <= 0 || months <= 0) return 0;
  if (r <= 0) return loan / months;
  return loan * r / (1 - Math.pow(1 + r, -months));
}

function monthlyCalc(loan, rate, years) {
  return getMethod() === "eir" ? monthlyEir(loan, rate, years) : monthlyFlat(loan, rate, years);
}

function updateMethodUI() {
  if (getMethod() === "eir") {
    els.rateLabel.textContent = "EIR %";
    els.hint.textContent = "EIR: LULUS ≤30% gaji · TRY 30%-50% · GAGAL >50%";
    if (num(els.rate) < 3) els.rate.value = "4.40";
  } else {
    els.rateLabel.textContent = "Flat Rate %";
    els.hint.textContent = "Flat: LULUS ≤30% gaji · TRY 30%-50% · GAGAL >50%";
    if (num(els.rate) > 3.5) els.rate.value = "2.30";
  }
}

function calcVariant(v) {
  const salary = num(els.salary);
  const lulusLimit = salary * (LULUS_LIMIT / 100);
  const tryLimit = salary * (TRY_LIMIT / 100);
  const depositInput = Math.max(num(els.depositAmount), 0);
  const rate = num(els.rate);

  const deposit = Math.min(depositInput, v.price);
  const loan = Math.max(v.price - deposit, 0);
  const monthly = monthlyCalc(loan, rate, selectedTenure);

  let result = "fail";
  if (salary > 0 && monthly <= lulusLimit) result = "pass";
  else if (salary > 0 && monthly <= tryLimit) result = "try";

  return { ...v, deposit, loan, monthly, result };
}

function priceRange(variants) {
  const prices = variants.map(v => v.price);
  return `${rm(Math.min(...prices))} - ${rm(Math.max(...prices))}`;
}

function render() {
  updateMethodUI();

  const computed = models.map(model => {
    const variants = model.variants.map(calcVariant);
    const passCount = variants.filter(v => v.result === "pass").length;
    const tryCount = variants.filter(v => v.result === "try").length;

    let modelResult = "fail";
    if (passCount > 0) modelResult = "pass";
    else if (tryCount > 0) modelResult = "try";

    const display = variants.find(v => v.result === "pass") || variants.find(v => v.result === "try") || variants[0];

    return { ...model, variants, passCount, tryCount, modelResult, display };
  });

  lastResults = computed;

  const totalPass = computed.filter(m => m.modelResult === "pass").length;
  const totalTry = computed.filter(m => m.modelResult === "try").length;
  const totalFail = computed.filter(m => m.modelResult === "fail").length;

  els.summary.textContent = `${totalPass} LULUS · ${totalTry} TRY · ${totalFail} GAGAL`;

  els.cards.innerHTML = computed.map((m, i) => {
    let badgeText = "❌ GAGAL";
    if (m.modelResult === "pass") badgeText = `✅ LULUS ${m.passCount}/${m.variants.length}`;
    if (m.modelResult === "try") badgeText = `⚠️ TRY ${m.tryCount}/${m.variants.length}`;

    return `
      <div class="card ${m.modelResult}" onclick="openModel(${i})">
        <div class="modelName">${m.model}</div>
        <div class="priceRange">${priceRange(m.variants)}</div>
        <div class="bestMonthly">${rm(m.display.monthly, true)}/bln</div>
        <div class="bestSpec">${m.display.spec} · ${selectedTenure} tahun</div>
        <span class="badge ${m.modelResult}">${badgeText}</span>
      </div>
    `;
  }).join("");

  const msg = `Saya nak semak Toyota eligibility.%0AGaji: ${rm(num(els.salary))}%0ATahun: ${selectedTenure}%0ADeposit: ${rm(num(els.depositAmount))}%0A${methodName()}: ${num(els.rate)}%25%0A${totalPass} lulus, ${totalTry} boleh try.`;
  els.waBtn.href = `https://wa.me/${salesPhone}?text=${msg}`;
}

function openModel(i) {
  const m = lastResults[i];
  const display = m.display;

  els.modalTitle.textContent = `Toyota ${m.model}`;
  els.modalSub.textContent = `${m.tag} · ${selectedTenure} Tahun · ${methodName()} ${num(els.rate).toFixed(2)}%`;
  els.startDeposit.textContent = rm(display.deposit);
  els.startMonthly.textContent = rm(display.monthly, true);
  els.modalStatus.textContent = m.modelResult === "pass" ? "✅ LULUS" : m.modelResult === "try" ? "⚠️ TRY" : "❌ GAGAL";

  els.variantRows.innerHTML = m.variants.map(v => {
    const label = v.result === "pass" ? "LULUS" : v.result === "try" ? "TRY" : "GAGAL";
    return `
      <tr>
        <td>${v.spec}</td>
        <td>${rm(v.deposit)}</td>
        <td class="monthly">${rm(v.monthly, true)}/bln</td>
        <td class="resultText ${v.result}">${label}</td>
      </tr>
    `;
  }).join("");

  els.modalTiny.textContent = `LULUS ≤30% gaji · TRY 30%-50% gaji · Deposit ${rm(num(els.depositAmount))} · ${methodName()} ${num(els.rate).toFixed(2)}% · ${selectedTenure} tahun. Anggaran sahaja.`;
  els.modal.classList.add("show");
}

function closeModal() {
  els.modal.classList.remove("show");
}

document.querySelectorAll(".tenureBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tenureBtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedTenure = Number(btn.dataset.tenure);
    render();
  });
});

[els.salary, els.depositAmount, els.rate, els.methodFlat, els.methodEir].forEach(el => {
  el.addEventListener("input", render);
  el.addEventListener("change", render);
});

els.closeBtn.addEventListener("click", closeModal);
els.modal.addEventListener("click", e => {
  if (e.target === els.modal) closeModal();
});

window.openModel = openModel;
render();
</script>
</body>
</html>
